name: Build & Deploy Lambda

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: dev
        type: choice
        options: [dev, uat, prod]

env:
  TF_VERSION: "1.9.5"

jobs:
  # Always build + test on every push/PR, regardless of deploy target.
  build:
    name: Build Rust Lambda binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: cargo test
        run: cargo test --workspace

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # Both cargo-lambda and Zig are cached in a fixed directory we control
      # and add to PATH ourselves, keyed on the pinned version below, so most
      # runs skip re-downloading them entirely.
      - name: Cache cargo-lambda
        id: cargo-lambda-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo-lambda-bin
          key: cargo-lambda-v1.6.1-${{ runner.os }}

      - name: Install cargo-lambda
        if: steps.cargo-lambda-cache.outputs.cache-hit != 'true'
        uses: jaxxstorm/action-install-gh-release@v1.12.0
        with:
          repo: cargo-lambda/cargo-lambda
          tag: v1.6.1
          extension-matching: disable
          rename-to: cargo-lambda
          chmod: 0755
          cache: false
          target: ~/.cargo-lambda-bin

      - name: Add cargo-lambda to PATH
        run: echo "$HOME/.cargo-lambda-bin" >> "$GITHUB_PATH"

      # cargo-lambda cross-compiles to aarch64-unknown-linux-musl using Zig as
      # the linker; the ubuntu-latest runner doesn't have it preinstalled.
      - name: Cache Zig
        id: zig-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ziglang-0.13.0-${{ runner.os }}

      - name: Install Zig
        run: pip3 install ziglang==0.13.0

      - name: Build & package bootstrap.zip
        run: terraform/lambda-zipper/build.sh bootstrap.zip

      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-zip
          path: bootstrap.zip
          retention-days: 7

  # Deploys dev automatically on main, or whichever environment is chosen
  # manually via workflow_dispatch. uat/prod are intended to be run manually
  # (or gate them behind GitHub Environments with required reviewers).
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'dev' }}
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    environment: ${{ github.event.inputs.environment || 'dev' }}
    env:
      ENV: ${{ github.event.inputs.environment || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bootstrap-zip
          path: .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Upload artifact to S3
        working-directory: terraform
        run: |
          ARTIFACT_BUCKET="aws-rust-serverless-oltp-lambda-artifacts"
          echo "ARTIFACT_BUCKET=$ARTIFACT_BUCKET" >> "$GITHUB_ENV"
          echo "ARTIFACT_KEY=dev/${GITHUB_SHA}/bootstrap.zip" >> "$GITHUB_ENV"
          aws s3 cp ../bootstrap.zip "s3://${ARTIFACT_BUCKET}/${ENV}/${GITHUB_SHA}/bootstrap.zip"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend-config="backend/dev.tfbackend"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        run: |
          terraform plan \
            -var-file="tfvars/dev.tfvars" \
            -var="artifact_key=${ARTIFACT_KEY}"
